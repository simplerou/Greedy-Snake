# Render 部署蓝图：在 Render 控制台选择 "Blueprint" 时自动读取本文件
services:
  - type: web
    name: greedy-snake
    runtime: python
    plan: free
    region: singapore          # 离中国较近；如不可选可改 oregon / frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # 部署时在 Render 控制台填入云数据库连接串（当前使用阿里云 RDS MySQL）
      # 务必填写：不填会回落到本地 SQLite，而 Render 容器文件系统是临时的，
      # 每次重新部署/实例重启数据都会丢失，也无法多实例共享榜单。
      # 密码含特殊字符需 URL 编码（@ 写成 %40）；同时记得在 RDS 白名单放通 Render 出口 IP
      - key: DATABASE_URL
        sync: false